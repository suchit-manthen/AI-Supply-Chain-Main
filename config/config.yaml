# Synthetic supermarket dataset configuration
data:
  start_date: "2022-01-01"
  end_date: "2024-12-31"          # ~3 years of daily sales
  random_seed: 42
  output:
    raw: "data/raw/sales.csv"
    products: "data/raw/products.csv"
    processed: "data/processed/sales_features.csv"

  # Number of products to generate (one product = one SKU per store)
  n_products: 24

  # Demand generation parameters
  demand:
    base_level_low: 10     # avg daily units for low-volume products
    base_level_high: 400   # avg daily units for high-volume products
    yearly_amp_frac: 0.15  # yearly seasonality amplitude as fraction of base
    weekly_weekend_boost: 0.25   # weekend uplift (grocery typical)
    promo_lift_low: 0.15   # multiplicative lift from a promotion
    promo_lift_high: 0.60
    holiday_lift: 0.35     # uplift around major holidays
    price_elasticity: -1.2 # typical grocery price elasticity (log-log)
    noise_std: 0.15        # log-normal demand noise
    discount_fraction: 0.08 # share of days a product is on promotion

  # Optional: hold-out is handled at model stage, not during generation

# Feature engineering & dataset splitting
features:
  target: "sales"
  lags: [1, 7, 14, 28]         # lagged target values (days)
  rolling_windows: [7, 14, 28]  # rolling mean/std window sizes (days)

  split:
    train_frac: 0.70            # chronological split by date
    val_frac: 0.15
    test_frac: 0.15

  output:
    features: "data/processed/sales_features.csv"
    train: "data/processed/train.csv"
    val: "data/processed/val.csv"
    test: "data/processed/test.csv"

# Forecasting models (Step 3)
models:
  output_dir: "data/processed"

  sarima:
    # Default fixed order (used when `candidates` is empty)
    order: [1, 1, 1]           # (p, d, q)
    seasonal_order: [1, 1, 1, 7]  # (P, D, Q, s) with s=7 (weekly)

    # Optional: candidate orders searched on the validation set (MAPE).
    # Leave empty ([]) to disable search and use the fixed order above.
    candidates:
      - order: [1, 1, 1]
        seasonal_order: [1, 1, 1, 7]
      - order: [1, 0, 1]
        seasonal_order: [1, 0, 1, 7]
      - order: [2, 1, 2]
        seasonal_order: [1, 1, 1, 7]
